name: Fork check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q tests/unittest

      - name: Build GitHub App image
        run: docker build --target github_app --tag pr-agent-fork-check -f docker/Dockerfile .

      - name: Validate GitHub App image
        run: python -m pytest -q tests/fork/test_github_app_image.py
