name: Propose upstream release

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: propose-upstream-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.prepare.outputs.needed }}
      prepared_sha: ${{ steps.prepare.outputs.prepared_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release proposal
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upstream_repo="The-PR-Agent/pr-agent"
          release_tag=$(gh api "repos/${upstream_repo}/releases/latest" --jq '.tag_name')
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          upstream_ref="refs/remotes/upstream/tags/${release_tag}"
          git fetch --no-tags "https://github.com/${upstream_repo}.git" \
            "refs/tags/${release_tag}:${upstream_ref}"

          if git merge-base --is-ancestor "${upstream_ref}^{commit}" origin/main; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
            printf 'origin/main already contains upstream release %s.\n' "$release_tag"
            exit 0
          fi

          lifecycle_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/fork/lifecycle-v1")
          lifecycle_type=$(jq -r '.object.type' <<< "$lifecycle_ref")
          lifecycle_tag_sha=$(jq -r '.object.sha' <<< "$lifecycle_ref")
          [[ "$lifecycle_type" == "tag" ]]
          [[ $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${lifecycle_tag_sha}" \
            --jq '.verification.verified') == "true" ]]

          decisions_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/fork/review-decisions-v1")
          decisions_type=$(jq -r '.object.type' <<< "$decisions_ref")
          decisions_tag_sha=$(jq -r '.object.sha' <<< "$decisions_ref")
          [[ "$decisions_type" == "tag" ]]
          [[ $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${decisions_tag_sha}" \
            --jq '.verification.verified') == "true" ]]

          git fetch --no-tags origin \
            refs/tags/fork/lifecycle-v1:refs/tags/fork/lifecycle-v1
          [[ $(git rev-parse 'refs/tags/fork/lifecycle-v1^{tag}') == "$lifecycle_tag_sha" ]]
          git fetch --no-tags origin \
            refs/tags/fork/review-decisions-v1:refs/tags/fork/review-decisions-v1
          [[ $(git rev-parse 'refs/tags/fork/review-decisions-v1^{tag}') == "$decisions_tag_sha" ]]

          git switch --detach "${upstream_ref}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_DATE
          GIT_COMMITTER_DATE=$(git show -s --format=%aI 'fork/lifecycle-v1^{commit}')

          if ! git cherry-pick fork/lifecycle-v1; then
            git cherry-pick --abort >/dev/null 2>&1 || true
            printf 'The lifecycle patch conflicts with upstream release %s.\n' "$release_tag" >&2
            git status --short
            exit 1
          fi
          GIT_COMMITTER_DATE=$(git show -s --format=%aI 'fork/review-decisions-v1^{commit}')
          export GIT_COMMITTER_DATE
          if ! git cherry-pick fork/review-decisions-v1; then
            git cherry-pick --abort >/dev/null 2>&1 || true
            printf 'The review-decisions patch conflicts with upstream release %s.\n' "$release_tag" >&2
            git status --short
            exit 1
          fi
          [[ $(git rev-list --count "${upstream_ref}^{commit}..HEAD") -eq 2 ]]
          prepared_sha=$(git rev-parse HEAD)
          git bundle create "$RUNNER_TEMP/prepared.bundle" HEAD

          {
            printf 'needed=true\n'
            printf 'prepared_sha=%s\n' "$prepared_sha"
            printf 'release_tag=%s\n' "$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Save prepared commit
        if: steps.prepare.outputs.needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: prepared-release
          path: ${{ runner.temp }}/prepared.bundle
          retention-days: 1

  test:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Load prepared commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: prepared-release
          path: ${{ runner.temp }}

      - name: Check out prepared commit
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
        run: |
          set -euo pipefail

          git clone "$RUNNER_TEMP/prepared.bundle" prepared
          cd prepared
          [[ $(git rev-parse 'HEAD^{commit}') == "$PREPARED_SHA" ]]

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        working-directory: prepared
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests/unittest

      - name: Build GitHub App image
        working-directory: prepared
        run: docker build --target github_app --tag pr-agent-fork-check -f docker/Dockerfile .

      - name: Validate GitHub App image
        working-directory: prepared
        run: python -m pytest -q tests/fork/test_github_app_image.py

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.needed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Load prepared commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: prepared-release
          path: ${{ runner.temp }}

      - name: Push prepared commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
          PREPARED_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          git clone --no-checkout "$RUNNER_TEMP/prepared.bundle" prepared
          cd prepared
          [[ $(git rev-parse 'HEAD^{commit}') == "$PREPARED_SHA" ]]

          upstream_repo="The-PR-Agent/pr-agent"
          release_tag=$(gh api "repos/${upstream_repo}/releases/latest" --jq '.tag_name')
          [[ "$release_tag" == "$PREPARED_RELEASE_TAG" ]]
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          upstream_ref="refs/remotes/upstream/tags/${release_tag}"
          git fetch --no-tags "https://github.com/${upstream_repo}.git" \
            "refs/tags/${release_tag}:${upstream_ref}"

          lifecycle_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/fork/lifecycle-v1")
          lifecycle_type=$(jq -r '.object.type' <<< "$lifecycle_ref")
          lifecycle_tag_sha=$(jq -r '.object.sha' <<< "$lifecycle_ref")
          [[ "$lifecycle_type" == "tag" ]]
          [[ $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${lifecycle_tag_sha}" \
            --jq '.verification.verified') == "true" ]]
          decisions_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/fork/review-decisions-v1")
          decisions_type=$(jq -r '.object.type' <<< "$decisions_ref")
          decisions_tag_sha=$(jq -r '.object.sha' <<< "$decisions_ref")
          [[ "$decisions_type" == "tag" ]]
          [[ $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${decisions_tag_sha}" \
            --jq '.verification.verified') == "true" ]]
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/fork/lifecycle-v1:refs/tags/fork/lifecycle-v1
          [[ $(git rev-parse 'refs/tags/fork/lifecycle-v1^{tag}') == "$lifecycle_tag_sha" ]]
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/fork/review-decisions-v1:refs/tags/fork/review-decisions-v1
          [[ $(git rev-parse 'refs/tags/fork/review-decisions-v1^{tag}') == "$decisions_tag_sha" ]]

          git switch --detach "${upstream_ref}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_DATE
          GIT_COMMITTER_DATE=$(git show -s --format=%aI 'fork/lifecycle-v1^{commit}')
          git cherry-pick fork/lifecycle-v1
          GIT_COMMITTER_DATE=$(git show -s --format=%aI 'fork/review-decisions-v1^{commit}')
          export GIT_COMMITTER_DATE
          git cherry-pick fork/review-decisions-v1
          [[ $(git rev-parse HEAD) == "$PREPARED_SHA" ]]

          branch="automation/upstream-${release_tag#v}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh auth setup-git
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${PREPARED_SHA}:refs/heads/${branch}"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
        id: push

      - name: Open pull request and dispatch fork check
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Update fork to upstream ${RELEASE_TAG}" \
            --body "Apply the signed fork lifecycle and review-decisions patches to upstream ${RELEASE_TAG}."
          gh workflow run fork-check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
